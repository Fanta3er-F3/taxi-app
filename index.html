<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #f39c12; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        #map { height: 45vh; width: 100%; border-bottom: 2px solid var(--accent); }
        .nav { display: flex; background: #222; position: sticky; top: 0; z-index: 100; }
        .nav-item { flex: 1; padding: 15px; text-align: center; font-size: 14px; opacity: 0.6; }
        .nav-item.active { opacity: 1; border-bottom: 3px solid var(--accent); color: var(--accent); }
        .content { height: 55vh; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .input-group { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        input { width: 100%; background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; margin-top: 8px; box-sizing: border-box; }
        .btn-order { background: var(--accent); color: black; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .history-card { background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid var(--accent); }
        .gps-btn { position: absolute; bottom: 56vh; right: 15px; z-index: 500; background: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="map"></div>
<button class="gps-btn" onclick="useGPS()">📍</button>

<div class="nav">
    <div class="nav-item active" onclick="tab('order', this)">Замовлення</div>
    <div class="nav-item" onclick="tab('history', this)">Історія</div>
    <div class="nav-item" onclick="tab('profile', this)">Профіль</div>
</div>

<div class="content">
    <div id="tab-order">
        <div class="input-group">
            <input type="text" id="from" placeholder="📍 Звідки виїжджаємо?">
            <input type="text" id="to" placeholder="🏁 Куди їдемо?">
            <input type="tel" id="phone" value="+380">
        </div>
        <button class="btn-order" onclick="confirmOrder()">ПІДТВЕРДИТИ ЗАМОВЛЕННЯ</button>
    </div>

    <div id="tab-history" style="display:none;"></div>

    <div id="tab-profile" style="display:none; text-align:center;">
        <img id="u-img" style="width:80px; border-radius:50%; border:2px solid var(--accent);">
        <h3 id="u-name">Клієнт</h3>
        <p id="u-stats">Поїздок: 0</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    const API = "https://carpet-ua.kesug.com/taxi/api.php";

    var map = L.map('map', {zoomControl: false}).setView([49.4229, 26.9871], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    var marker = L.marker([49.4229, 26.9871], {draggable: true}).addTo(map);

    function useGPS() {
        navigator.geolocation.getCurrentPosition(p => {
            const c = [p.coords.latitude, p.coords.longitude];
            map.setView(c, 16); marker.setLatLng(c);
        });
    }

    function tab(name, el) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('tab-order').style.display = name === 'order' ? 'block' : 'none';
        document.getElementById('tab-history').style.display = name === 'history' ? 'block' : 'none';
        document.getElementById('tab-profile').style.display = name === 'profile' ? 'block' : 'none';
        if(name === 'history' || name === 'profile') loadData();
    }

    async function loadData() {
        const r = await fetch(`${API}?action=get_data&user_id=${tg.initDataUnsafe.user.id}`);
        const d = await r.json();
        
        document.getElementById('tab-history').innerHTML = d.history.map(h => `
            <div class="history-card"><b>${h.created_at}</b><br>${h.from_addr} ➔ ${h.to_addr}<br>Ціна: ${h.price}</div>
        `).join('') || "Історія порожня";
        
        document.getElementById('u-name').innerText = tg.initDataUnsafe.user.first_name;
        document.getElementById('u-stats').innerText = `Поїздок: ${d.profile?.trips_count || 0}`;
        if(tg.initDataUnsafe.user.photo_url) document.getElementById('u-img').src = tg.initDataUnsafe.user.photo_url;
    }

    async function confirmOrder() {
        const o = {
            user_id: tg.initDataUnsafe.user.id,
            name: tg.initDataUnsafe.user.first_name,
            f: document.getElementById('from').value,
            t: document.getElementById('to').value,
            p: document.getElementById('phone').value,
            price: "180 ₴",
            tariff: "Standard"
        };
        if(!o.f || !o.t) return tg.showAlert("Вкажіть маршрут!");
        
        await fetch(`${API}?action=create_order`, {method:'POST', body:JSON.stringify(o)});
        tg.sendData(JSON.stringify(o));
    }
</script>
</body>
</html>
